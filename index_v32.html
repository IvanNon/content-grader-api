function AnimatedNumber({ target, decimals = 0, duration = 1200, suffix = "" }) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    let frames = 60;
    let frame = 0;
    const interval = setInterval(() => {
      frame++;
      const progress = frame / frames;
      setValue(Math.floor(target * progress));
      if (frame >= frames) {
        setValue(target);
        clearInterval(interval);
      }
    }, duration / frames);
    return () => clearInterval(interval);
  }, [target, duration]);
  return value.toFixed(decimals) + suffix;
}

function ScoreBar({ score, showLabel = true }) {
  let color = "#000";
  if (score >= 0.7) color = "#000";
  else if (score >= 0.4) color = "rgba(0,0,0,0.5)";
  else color = "rgba(0,0,0,0.2)";
  return (
    <>
      <div style={{ width: "100%", height: 3, background: "rgba(0,0,0,0.1)", borderRadius: 2, overflow: "hidden" }}>
        <div style={{ width: `${score * 100}%`, height: "100%", background: color, transition: "width 0.3s" }} />
      </div>
      {showLabel && <div className="font-mono" style={{ fontSize: 9, color: "rgba(0,0,0,0.4)", marginTop: 4 }}>{(score * 100).toFixed(0)}</div>}
    </>
  );
}

// Simple markdown to HTML renderer
function markdownToHtml(md) {
  if (!md) return "";
  let html = md
    .replace(/^### (.*?)$/gm, "<h3 style='margin-top:16px;margin-bottom:8px;font-weight:700;font-size:16px;'>$1</h3>")
    .replace(/^## (.*?)$/gm, "<h2 style='margin-top:24px;margin-bottom:12px;font-weight:700;font-size:20px;'>$1</h2>")
    .replace(/^# (.*?)$/gm, "<h1 style='margin-top:32px;margin-bottom:16px;font-weight:700;font-size:28px;'>$1</h1>")
    .replace(/\*\*(.*?)\*\*/g, "<strong style='font-weight:700;'>$1</strong>")
    .replace(/\*(.*?)\*/g, "<em style='font-style:italic;'>$1</em>")
    .replace(/^- (.*?)$/gm, "<li style='margin-left:20px;'>$1</li>")
    .replace(/^(\d+)\. (.*?)$/gm, "<li style='margin-left:20px;'>$2</li>")
    .replace(/\n\n/g, "</p><p>")
    .replace(/^(.+)$/gm, "<p style='margin-bottom:12px;line-height:1.6;'>$1</p>");
  html = "<div style='font-size:14px;color:#000;'>" + html + "</div>";
  return html;
}

            <div>
              <label className="font-mono" style={{ fontSize: 9, letterSpacing: "0.15em", textTransform: "uppercase", color: "rgba(0,0,0,0.4)", display: "block", marginBottom: 4 }}>Target</label>
              <input type="number" min="1" max="100" value={targetScore} onChange={(e) => setTargetScore(Number(e.target.value))} className="font-mono" style={{ width: 60, padding: "6px 8px", border: "1px solid #000", fontSize: 12, fontWeight: 600 }} />
            </div>
          </div>

          {optimizing && <div className="font-mono" style={{ fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase", color: "rgba(0,0,0,0.6)", marginTop: 16 }}>Optimizing Round {currentRound + 1}...</div>}
        </section>

        {/* Side-by-Side Content Panels */}
        <section style={{ flex: 1, display: "flex", borderBottom: "1px solid #000", minHeight: 0 }}>
          {/* Left: Original */}
          <div style={{ flex: 1, borderRight: "1px solid #000", overflow: "hidden", display: "flex", flexDirection: "column" }}>
            <div style={{ padding: "16px", borderBottom: "1px solid #000", background: "rgba(0,0,0,0.02)" }}>
              <p className="font-mono" style={{ fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "rgba(0,0,0,0.4)" }}>Original</p>
            </div>
            <div style={{ flex: 1, overflow: "auto", padding: "20px" }}>
              <div style={{ fontSize: 13, color: "#000", lineHeight: 1.6 }} dangerouslySetInnerHTML={{ __html: markdownToHtml(originalMarkdown) }} />
            </div>
          </div>

          {/* Right: Optimized */}
          <div style={{ flex: 1, overflow: "hidden", display: "flex", flexDirection: "column" }}>
            <div style={{ padding: "16px", borderBottom: "1px solid #000", background: "rgba(0,0,0,0.02)" }}>
              <p className="font-mono" style={{ fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "rgba(0,0,0,0.4)" }}>Optimized {currentRound > 0 && `(Round ${currentRound})`}</p>
            </div>
            <div style={{ flex: 1, overflow: "auto", padding: "20px" }}>
              {optimizedMarkdown ? (
                <div style={{ fontSize: 13, color: "#000", lineHeight: 1.6 }} dangerouslySetInnerHTML={{ __html: markdownToHtml(optimizedMarkdown) }} />
              ) : (
                <p className="font-mono" style={{ fontSize: 11, color: "rgba(0,0,0,0.3)", fontStyle: "italic" }}>Run optimization to see improved content</p>
              )}
            </div>
          </div>
        </section>

        {/* Change Log & Signal Movement */}
        {currentRoundData && (
          <section style={{ borderBottom: "1px solid #000", maxHeight: 300, overflow: "auto" }}>
            <div style={{ padding: "16px", borderBottom: "1px solid #000", background: "rgba(0,0,0,0.02)" }}>
              <p className="font-mono" style={{ fontSize: 10, letterSpacing: "0.2em", textTransform: "uppercase", color: "rgba(0,0,0,0.4)" }}>Changes in Round {currentRound}</p>
            </div>
            <div style={{ padding: "20px" }}>
              {currentRoundData.changes.map((change, i) => (
                <div key={i} style={{ marginBottom: 16, paddingBottom: 16, borderBottom: i < currentRoundData.changes.length - 1 ? "1px solid rgba(0,0,0,0.1)" : "none" }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 8 }}>
                    <div style={{ width: 24, height: 24, borderRadius: 4, background: change.impact === "strong" ? "rgba(0,200,83,0.2)" : "rgba(255,145,0,0.2)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 10, fontWeight: 700, color: change.impact === "strong" ? "#00c853" : "#ff9100" }}>
                      {change.type === "added" ? "+" : change.type === "modified" ? "∆" : "~"}
                    </div>
                    <div style={{ flex: 1 }}>
                      <p className="font-mono" style={{ fontSize: 9, letterSpacing: "0.1em", textTransform: "uppercase", color: "rgba(0,0,0,0.4)", marginBottom: 2 }}>{change.type}</p>
                      <p style={{ fontSize: 12, color: "#000" }}>{change.description}</p>
                    </div>
                  </div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginLeft: 36 }}>
                    {change.targets.map((t, j) => (
                      <span key={j} className="font-mono" style={{ fontSize: 9, padding: "2px 6px", background: "rgba(0,0,0,0.08)", color: "rgba(0,0,0,0.6)", borderRadius: 2 }}>{t}</span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </section>
        )}
      </main>

      {/* Action Buttons */}
      <footer style={{ borderTop: "1px solid #000", padding: "16px", background: "rgba(0,0,0,0.01)" }}>
        <div className="container" style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          {optimizedMarkdown && (
            <button onClick={handleCopyOptimized} className="font-mono" style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 16px", border: "1px solid #000", fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase", background: "#fff", cursor: "pointer", fontWeight: 600 }}>
              <Copy size={12} /> Copy Optimized
            </button>
          )}
          <button onClick={onBack} className="font-mono" style={{ display: "flex", alignItems: "center", gap: 8, padding: "10px 16px", border: "1px solid #000", fontSize: 10, letterSpacing: "0.15em", textTransform: "uppercase", background: "rgba(0,0,0,0.05)", cursor: "pointer" }}>
              <ArrowLeft size={12} /> Back to Report
          </button>
        </div>
      </footer>

      <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
    </div>
  );
}

// ============================================================================
// MAIN APP (modified with editor state)
// ============================================================================

const API_BASE_URL = "https://content-grader-api.vercel.app";

function ContentGrader() {
  const [view, setView] = useState("home");
  const [analyzedUrl, setAnalyzedUrl] = useState("");
  const [analyzedKeyword, setAnalyzedKeyword] = useState("");
  const [analysisData, setAnalysisData] = useState(null);
  const [analysisError, setAnalysisError] = useState(null);
  const [apiReady, setApiReady] = useState(false);

  const handleAnalyze = (url, keyword) => {
    setAnalyzedUrl(url);
    setAnalyzedKeyword(keyword);
    setAnalysisData(null);
    setAnalysisError(null);
    setApiReady(false);
    setView("loading");

    // Start real API call
    fetch(`${API_BASE_URL}/api/analyze`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, keyword }),
    })
      .then(resp => {
        if (!resp.ok) return resp.json().then(e => { throw new Error(e.error || "Analysis failed"); });
        return resp.json();
      })
      .then(data => {
        setAnalysisData(data);
        setApiReady(true);
      })
      .catch(err => {
        console.error("API error:", err);
        setAnalysisError(err.message);
        setApiReady(true);
      });
  };

  const handleLoadingComplete = () => {
    if (apiReady) {
      setView("emailgate");
    }
  };

  useEffect(() => {
    if (apiReady && view === "loading") {
      // The LoadingView will call onComplete when its animation finishes
    }
  }, [apiReady, view]);

  return (
    <>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Space Grotesk', system-ui, sans-serif; background: #fff; color: #000; -webkit-font-smoothing: antialiased; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .container { width: 100%; margin-left: auto; margin-right: auto; padding-left: 1rem; padding-right: 1rem; }
        @media (min-width: 640px) { .container { padding-left: 1.5rem; padding-right: 1.5rem; } }
        @media (min-width: 1024px) { .container { padding-left: 2rem; padding-right: 2rem; max-width: 1280px; } }
        input::placeholder { color: rgba(0,0,0,0.25); }
        button { font-family: inherit; }
        .hidden-mobile { display: none; }
        .mobile-only { display: block; }
        @media (min-width: 1024px) { .hidden-mobile { display: flex; } .mobile-only { display: none; } }
      `}</style>

      {view === "home" && <HomeView onAnalyze={handleAnalyze} />}
      {view === "loading" && <LoadingView url={analyzedUrl} apiReady={apiReady} apiError={analysisError} onComplete={() => setView("emailgate")} />}
      {view === "emailgate" && <EmailGateView url={analyzedUrl} onSubmit={() => setView("report")} />}
      {view === "report" && <ReportView data={analysisData || DEMO_DATA} onBack={() => { setView("home"); setAnalysisData(null); }} onOpenEditor={() => setView("editor")} />}
      {view === "editor" && <ContentEditorView data={analysisData || DEMO_DATA} onBack={() => setView("report")} />}
    </>
  );
}

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(React.createElement(ContentGrader));
  </script>
</body>
</html>
